<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090f"/>
      <stop offset="50%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#07090f"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ambient Glow -->
  <circle cx="200" cy="150" r="250" fill="#10b981" opacity="0.18" filter="url(#glow)"/>
  <circle cx="1000" cy="480" r="280" fill="#059669" opacity="0.15" filter="url(#glow)"/>

  <!-- Grid lines -->
  <line x1="100" y1="0" x2="100" y2="630" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="1100" y1="0" x2="1100" y2="630" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="100" x2="1200" y2="100" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="530" x2="1200" y2="530" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Brand Header -->
  <g transform="translate(100, 75)">
    <rect width="44" height="44" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="60" y="30" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5">
      Swa<tspan fill="rgba(255,255,255,0.4)" font-weight="300">lekhani</tspan>
    </text>
  </g>

  <!-- Badge -->
  <g transform="translate(100, 160)">
    <rect width="360" height="36" rx="18" fill="rgba(255,255,255,0.04)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="20" cy="18" r="5" fill="#10b981"/>
    <text x="36" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">
      ACADEMIC & INSTITUTIONAL
    </text>
  </g>

  <!-- Title -->
  <text x="100" y="270" fill="url(#brandGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">
    School Letterhead Format
  </text>

  <!-- Subtitle -->
  <text x="100" y="340" fill="rgba(255,255,255,0.75)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">
    CBSE, ICSE & College Letterheads with Affiliation & Certificates
  </text>

  <!-- Features Row -->
  <g transform="translate(100, 420)">
    <rect width="280" height="50" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="20" y="31" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="500">
      ⚡ AI-Powered Drafting
    </text>

    <g transform="translate(300, 0)">
      <rect width="280" height="50" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="20" y="31" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="500">
        📄 Print-Ready Vector PDF
      </text>
    </g>

    <g transform="translate(600, 0)">
      <rect width="280" height="50" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="20" y="31" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="500">
        🇮🇳 Bilingual (Hindi & English)
      </text>
    </g>
  </g>

  <!-- Footer URL -->
  <text x="100" y="570" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="16">
    swalekhani.com/templates/school-letterpad
  </text>
</svg>